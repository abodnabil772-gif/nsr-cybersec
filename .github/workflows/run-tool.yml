name: NSR Execute Tool

on:
  workflow_dispatch:
    inputs:
      tool:
        description: 'Tool ID (msf/sliver/asyncrat/spynote/set/aircrack)'
        required: true
      target:
        description: 'Target'
        required: true
      op_id:
        description: 'Operation ID from Supabase'
        required: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull Kali Docker image
        run: docker pull kalilinux/kali-rolling

      - name: Start Kali container
        run: docker run -d --name kali kalilinux/kali-rolling sleep 3600

      - name: Install required tools inside Kali
        run: |
          docker exec kali bash -c "
            apt-get update -qq && 
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              metasploit-framework set aircrack-ng git python3 python3-pip \
              default-jdk wget curl 2>&1 | tail -3
          "

      - name: Install Python supabase client
        run: pip install supabase==2.7.4

      - name: Execute tool
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TOOL: ${{ github.event.inputs.tool }}
          TARGET: ${{ github.event.inputs.target }}
          OP_ID: ${{ github.event.inputs.op_id }}
        run: python3 .github/scripts/runner.py
